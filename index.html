<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Guardias de Técnicos - Valencia</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary-color); }
        .controls-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h3 { margin-top: 0; color: var(--primary-color); border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: #27ae60; }
        .btn-success:hover { background-color: #219653; }
        
        /* Calendario mensual */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .day-name {
            text-align: center;
            font-weight: bold;
            background: var(--primary-color);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        .calendar-day {
            background: white;
            min-height: 110px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px;
            position: relative;
            font-size: 13px;
            cursor: pointer;
        }
        .calendar-day:hover {
            border-color: var(--accent-color);
        }
        .calendar-day.other-month {
            background: #f1f1f1;
            color: #aaa;
        }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .day-number {
            font-weight: bold;
        }
        .festivo-icon {
            font-size: 12px;
            background: #e74c3c;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .festivo-local-icon {
            font-size: 12px;
            background: #e67e22;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .guard-badge {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 3px;
            color: white;
            margin-top: 2px;
            display: block;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        .salary-badge {
            font-size: 10px;
            color: #555;
            margin-top: 4px;
            display: block;
            font-weight: bold;
        }
        
        /* Listas y Formularios */
        ul { padding-left: 0; list-style: none; }
        li { padding: 8px; margin-bottom: 5px; background: #fdfdfd; border: 1px solid #eee; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        
        .legend-color {
            width: 15px;
            height: 15px;
            display: inline-block;
            border-radius: 3px;
            margin-right: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Gestión de Guardias de Técnicos (Valencia)</h1>
        <div>
            <button class="btn btn-success" onclick="generarNuevoAno()">🔄 Rotar / Nuevo Año</button>
        </div>
    </header>

    <div class="controls-panel">
        <!-- Panel de Tarifas -->
        <div class="card">
            <h3>Tarifas de Guardia</h3>
            <label>Precio Día Laboral (€):</label>
            <input type="number" id="precioLaboral" value="24" onchange="actualizarTarifas()">
            
            <label>Precio Día Festivo (€):</label>
            <input type="number" id="precioFestivo" value="80" onchange="actualizarTarifas()">
            
            <div style="font-size: 12px; color: #555; margin-top: 10px;">
                <span class="festivo-icon">🎈 N</span> Festivo Nacional / España<br>
                <span class="festivo-local-icon">🏛️ L</span> Festivo Local (Valencia)
            </div>
        </div>

        <!-- Gestión de Técnicos -->
        <div class="card">
            <h3>Técnicos y Colores</h3>
            <ul id="listaTecnicos"></ul>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="nuevoNombreTecnico" placeholder="Nombre del técnico" style="margin-bottom:0;">
                <input type="color" id="nuevoColorTecnico" value="#9b59b6" style="width: 50px; height: 38px; padding: 0; border: none; cursor: pointer;">
                <button class="btn" onclick="agregarTecnico()">Añadir</button>
            </div>
        </div>
    </div>

    <!-- Calendario Principal -->
    <div class="card">
        <div class="calendar-header">
            <button class="btn" onclick="cambiarMes(-1)">❮ Mes Anterior</button>
            <h2 id="mesAnoTitulo" style="margin: 0;">Mes Año</h2>
            <button class="btn" onclick="cambiarMes(1)">Mes Siguiente ❯</button>
        </div>
        <div class="calendar-grid" id="nombresDias">
            <div class="day-name">Lun</div>
            <div class="day-name">Mar</div>
            <div class="day-name">Mié</div>
            <div class="day-name">Jue</div>
            <div class="day-name">Vie</div>
            <div class="day-name">Sáb</div>
            <div class="day-name">Dom</div>
        </div>
        <div class="calendar-grid" id="cuadriculaDias" style="margin-top: 5px;"></div>
    </div>
</div>

<script>
    let fechaActual = new Date();
    let tarifas = { laboral: 24, festivo: 80 };
    
    let tecnicos = [
        { id: 1, nombre: "Lucas", color: "#e84393" },
        { id: 2, nombre: "Óscar Ibarreta", color: "#d63031" },
        { id: 3, nombre: "Jacobo", color: "#0984e3" },
        { id: 4, nombre: "Óscar Idáñez", color: "#00b894" }
    ];

    // Festivos de España y Locales de Valencia (Formato "MM-DD" o específicos por año)
    // tipo: 'nacional' o 'local'
    const festivosFijos = {
        "01-01": { nombre: "Año Nuevo", tipo: "nacional" },
        "01-06": { nombre: "Epifanía del Señor", tipo: "nacional" },
        "03-19": { nombre: "San José (Valencia)", tipo: "local" },
        "05-01": { nombre: "Fiesta del Trabajo", tipo: "nacional" },
        "06-24": { nombre: "San Juan (Valencia)", tipo: "local" },
        "08-15": { nombre: "Asunción de la Virgen", tipo: "nacional" },
        "10-09": { nombre: "Día de la Comunitat Valenciana", tipo: "local" },
        "10-12": { nombre: "Fiesta Nacional de España", tipo: "nacional" },
        "11-01": { nombre: "Todos los Santos", tipo: "nacional" },
        "12-06": { nombre: "Día de la Constitución Española", tipo: "nacional" },
        "12-08": { nombre: "Inmaculada Concepción", tipo: "nacional" },
        "12-25": { nombre: "Natividad del Señor", tipo: "nacional" }
    };

    let asignacionGuardias = {};

    function inicializarApp() {
        renderizarTecnicos();
        renderizarCalendario();
    }

    function renderizarTecnicos() {
        const lista = document.getElementById('listaTecnicos');
        lista.innerHTML = '';
        tecnicos.forEach(tec => {
            lista.innerHTML += `
                <li>
                    <span><span class="legend-color" style="background:${tec.color}"></span>${tec.nombre}</span>
                    <button class="btn" style="padding: 2px 6px; font-size: 11px; background: #e74c3c;" onclick="eliminarTecnico(${tec.id})">Eliminar</button>
                </li>`;
        });
    }

    function agregarTecnico() {
        const nombreInput = document.getElementById('nuevoNombreTecnico');
        const colorInput = document.getElementById('nuevoColorTecnico');
        if(nombreInput.value.trim() === '') return;

        const nuevoId = tecnicos.length > 0 ? Math.max(...tecnicos.map(t => t.id)) + 1 : 1;
        tecnicos.push({ id: nuevoId, nombre: nombreInput.value.trim(), color: colorInput.value });
        nombreInput.value = '';
        renderizarTecnicos();
        renderizarCalendario();
    }

    function eliminarTecnico(id) {
        tecnicos = tecnicos.filter(t => t.id !== id);
        renderizarTecnicos();
        renderizarCalendario();
    }

    function cambiarMes(delta) {
        fechaActual.setMonth(fechaActual.getMonth() + delta);
        renderizarCalendario();
    }

    function obtenerViernesDeGuardia(fecha) {
        let f = new Date(fecha);
        let diaSemana = f.getDay(); // 0: Dom, 5: Vie
        let distancia = (diaSemana >= 5) ? (5 - diaSemana) : -(2 + (4 - diaSemana));
        f.setDate(f.getDate() + distancia);
        f.setHours(0,0,0,0);
        return f;
    }

    function obtenerTecnicoParaViernes(viernesDate) {
        const clave = viernesDate.toISOString().split('T')[0];
        if (asignacionGuardias[clave]) {
            return tecnicos.find(t => t.id === asignacionGuardias[clave]);
        }
        if (tecnicos.length === 0) return null;
        let startOfYear = new Date(viernesDate.getFullYear(), 0, 1);
        let pastDays = Math.floor((viernesDate - startOfYear) / (24 * 60 * 60 * 1000));
        let semanaNum = Math.floor(pastDays / 7);
        let indiceTecnico = semanaNum % tecnicos.length;
        return tecnicos[indiceTecnico];
    }

    function esFestivo(fecha) {
        let mesStr = String(fecha.getMonth() + 1).padStart(2, '0');
        let diaStr = String(fecha.getDate()).padStart(2, '0');
        let clave = `${mesStr}-${diaStr}`;
        let diaSemana = fecha.getDay();
        
        // Sábado (6) y Domingo (0) son festivos por defecto
        if (diaSemana === 0 || diaSemana === 6) {
            return { esFestivo: true, tipo: 'finDeSemana', nombre: 'Fin de semana' };
        }

        if (festivosFijos[clave]) {
            return { esFestivo: true, tipo: festivosFijos[clave].tipo, nombre: festivosFijos[clave].nombre };
        }

        return { esFestivo: false };
    }

    // Calcula el importe total de la semana de guardia (Viernes a Viernes: 7 días)
    function calcularImporteSemana(viernesDate) {
        let laboralCount = 0;
        let festivoCount = 0;

        let cursor = new Date(viernesDate);
        for (let i = 0; i < 7; i++) {
            let resFestivo = esFestivo(cursor);
            if (resFestivo.esFestivo) {
                festivoCount++;
            } else {
                laboralCount++;
            }
            cursor.setDate(cursor.getDate() + 1);
        }

        let total = (laboralCount * tarifas.laboral) + (festivoCount * tarifas.festivo);
        return { total, laboralCount, festivoCount };
    }

    function renderizarCalendario() {
        const ano = fechaActual.getFullYear();
        const mes = fechaActual.getMonth();
        
        const mesesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        document.getElementById('mesAnoTitulo').innerText = `${mesesNombres[mes]} ${ano}`;

        const primerDiaMes = new Date(ano, mes, 1);
        const ultimoDiaMes = new Date(ano, mes + 1, 0);
        
        let primerDiaIndice = primerDiaMes.getDay() - 1;
        if (primerDiaIndice === -1) primerDiaIndice = 6;

        const cuadricula = document.getElementById('cuadriculaDias');
        cuadricula.innerHTML = '';

        let prevMesUltimoDia = new Date(ano, mes, 0).getDate();
        for (let i = primerDiaIndice - 1; i >= 0; i--) {
            let diaNum = prevMesUltimoDia - i;
            let fechaCelda = new Date(ano, mes - 1, diaNum);
            cuadricula.appendChild(crearCeldaDia(diaNum, fechaCelda, true));
        }

        for (let i = 1; i <= ultimoDiaMes.getDate(); i++) {
            let fechaCelda = new Date(ano, mes, i);
            cuadricula.appendChild(crearCeldaDia(i, fechaCelda, false));
        }

        let totalCeldasActuales = primerDiaIndice + ultimoDiaMes.getDate();
        let totalCeldasGrid = Math.ceil(totalCeldasActuales / 7) * 7;
        let diasSiguientes = totalCeldasGrid - totalCeldasActuales;
        for (let i = 1; i <= diasSiguientes; i++) {
            let fechaCelda = new Date(ano, mes + 1, i);
            cuadricula.appendChild(crearCeldaDia(i, fechaCelda, true));
        }
    }

    function crearCeldaDia(diaNum, fecha, esOtroMes) {
        const div = document.createElement('div');
        div.className = `calendar-day ${esOtroMes ? 'other-month' : ''}`;
        
        let festivoInfo = esFestivo(fecha);
        let indicadorFestivoHTML = '';
        if (festivoInfo.esFestivo && festivoInfo.tipo !== 'finDeSemana') {
            if (festivoInfo.tipo === 'nacional') {
                indicadorFestivoHTML = `<span class="festivo-icon" title="${festivoInfo.nombre}">🎈 N</span>`;
            } else if (festivoInfo.tipo === 'local') {
                indicadorFestivoHTML = `<span class="festivo-local-icon" title="${festivoInfo.nombre} (Valencia)">🏛️ L</span>`;
            }
        }

        div.innerHTML = `
            <div class="day-header">
                <span class="day-number">${diaNum}</span>
                ${indicadorFestivoHTML}
            </div>
        `;

        let viernesAsociado = obtenerViernesDeGuardia(fecha);
        let tecnicoAsignado = obtenerTecnicoParaViernes(viernesAsociado);

        if (tecnicoAsignado) {
            div.innerHTML += `<span class="guard-badge" style="background-color: ${tecnicoAsignado.color};" title="Guardia (Viernes a Viernes)">👤 ${tecnicoAsignado.nombre}</span>`;
            
            // Si es viernes (inicio de semana), calculamos y mostramos el importe total de esa semana de guardia
            if (fecha.getDay() === 5) {
                let calculo = calcularImporteSemana(viernesAsociado);
                div.innerHTML += `<span class="salary-badge">💰 ${calculo.total}€ (${calculo.festivoCount}f, ${calculo.laboralCount}l)</span>`;
            }
        }

        let viernesDateStr = viernesAsociado.toISOString().split('T')[0];
        div.onclick = () => modificarGuardiaModal(viernesAsociado, viernesDateStr);

        return div;
    }

    function modificarGuardiaModal(viernesDate, viernesDateStr) {
        let fechaStr = viernesDate.toLocaleDateString();
        let calculo = calcularImporteSemana(viernesDate);
        let nombresOpciones = tecnicos.map(t => `${t.nombre} (ID: ${t.id})`).join('\n');
        
        let respuesta = prompt(`Semana del Viernes ${fechaStr}\nTotal estimado: ${calculo.total}€ (${calculo.festivoCount} festivos, ${calculo.laboralCount} laborales).\n\nIntroduce el ID del nuevo técnico para reasignar (Baja/Cambio):`, "");
        
        if (respuesta !== null && respuesta.trim() !== "") {
            let idTecnico = parseInt(respuesta);
            if (tecnicos.some(t => t.id === idTecnico)) {
                asignacionGuardias[viernesDateStr] = idTecnico;
                renderizarCalendario();
            } else {
                alert("ID de técnico no válido.");
            }
        }
    }

    function actualizarTarifas() {
        tarifas.laboral = parseFloat(document.getElementById('precioLaboral').value) || 0;
        tarifas.festivo = parseFloat(document.getElementById('precioFestivo').value) || 0;
        renderizarCalendario();
    }

    function generarNuevoAno() {
        if(confirm("¿Estás seguro de generar un nuevo ciclo anual cambiando el orden de rotación para los festivos?")) {
            let primerTecnico = tecnicos.shift();
            tecnicos.push(primerTecnico);
            asignacionGuardias = {};
            renderizarCalendario();
            alert("¡Rotación anual aplicada con éxito!");
        }
    }

    window.onload = inicializarApp;
</script>

</body>
</html>
