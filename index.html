<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Guardias - Técnicos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de colores y variables */
            --bg-app: #f0f4f8;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            
            /* Colores de técnicos extraídos de la imagen */
            --tec-jcarlos: #facc15; /* Amarillo */
            --tec-oscar-i: #ef4444; /* Rojo */
            --tec-lucas: #d946ef;    /* Magenta */
            --tec-oscar-b: #3b82f6; /* Azul */
            
            --guardia-opacity: 0.3; /* Opacidad para el fondo del día de guardia */
            
            --radius-lg: 16px;
            --radius-md: 8px;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-app); color: var(--text-main); padding: 24px; min-height: 100vh; }

        .main-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        /* Header */
        header { background: var(--bg-card); padding: 20px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; color: #0f172a; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        
        .btn { padding: 10px 20px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;}
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--bg-app); border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }
        
        .month-nav { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start; }
        
        /* Calendario */
        .calendar-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; border: 1px solid var(--border); background: var(--border); border-radius: var(--radius-md); overflow: hidden; }
        
        .cal-header { text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); padding: 12px 5px; background: var(--bg-app); }
        .cal-cell { background: var(--bg-card); min-height: 110px; padding: 8px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .cal-cell.other-month { background: #f9fafb; opacity: 0.6; }
        .cal-cell.empty { background: var(--bg-app); }
        
        .day-num { font-weight: 700; font-size: 1.1rem; line-height: 1; }
        .cal-cell.is-festivo .day-num { color: #dc2626; }
        
        .fest-icons { display: flex; gap: 3px; position: absolute; top: 8px; right: 8px; }
        .fest-icon { font-size: 0.6rem; font-weight: bold; padding: 2px 4px; border-radius: 4px; color: white; }
        .fest-nac { background-color: #dc2626; } /* España */
        .fest-aut { background-color: #ea580c; } /* C.Valenciana */
        .fest-loc { background-color: #9333ea; } /* Local Valencia */

        .day-rates { display: flex; flex-direction: column; gap: 2px; font-size: 0.7rem; color: var(--text-muted); margin-top: auto; padding-top: 10px;}
        .rate-row { display: flex; justify-content: space-between; }
        .rate-val { font-weight: 600; }
        .is-festivo .rate-row.lab { text-decoration: line-through; opacity: 0.5;}
        .is-festivo .rate-row.fes { color: #dc2626; font-weight: bold; }

        /* Indicador de Guardia en el día */
        .guardia-marker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;}
        /* Se aplicará un background-color inline con opacidad vía JS */

        .guardia-name { position: relative; z-index: 1; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: var(--text-main); /* El color del texto se ajusta por JS */ margin-top: -2px; text-shadow: 0 1px 2px rgba(255,255,255,0.7); }


        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .sidebar-card h3 { font-size: 1.1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* Resumen Semanal */
        .weekly-summary-list { display: flex; flex-direction: column; gap: 10px; }
        .weekly-item { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 6px;}
        .weekly-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;}
        .weekly-details { display: flex; justify-content: space-between; align-items: center; }
        .weekly-tech { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem;}
        .tech-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .weekly-pay { font-weight: 800; font-size: 1.1rem; color: #16a34a; }

        /* Gestión Técnicos */
        .tech-mgmt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;}
        .tech-mgmt-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-app); border-radius: var(--radius-md); border: 1px solid var(--border); }
        .tech-mgmt-info { display: flex; align-items: center; gap: 10px; font-weight: 600; }

        /* Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal { background: var(--bg-card); padding: 30px; border-radius: var(--radius-lg); width: 400px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 20px; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-body { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.9rem; font-weight: 600; }
        .form-group input { padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        /* Helper classes */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>📅 Cuadrante de Guardias</h1>
            <div class="header-actions">
                <button class="btn btn-danger" onclick="openResetYearModal()">⚠️ Generar Nuevo Año (Borrar y Rotar)</button>
                <div class="month-nav">
                    <button class="btn btn-secondary" onclick="changeMonth(-1)">‹</button>
                    <span id="current-month-label" style="min-width: 180px; text-align: center;"></span>
                    <button class="btn btn-secondary" onclick="changeMonth(1)">›</button>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card calendar-card">
                <h2>🗓️ Calendario Mensual</h2>
                <div class="calendar-grid">
                    <div class="cal-header">Lun</div>
                    <div class="cal-header">Mar</div>
                    <div class="cal-header">Mié</div>
                    <div class="cal-header">Jue</div>
                    <div class="cal-header">Vie</div>
                    <div class="cal-header">Sáb</div>
                    <div class="cal-header">Dom</div>
                    </div>
            </div>

            <aside class="sidebar">
                <div class="card sidebar-card">
                    <h3>📋 Guardia Semanal (Viernes a Viernes)</h3>
                    <div class="weekly-summary-list" id="weekly-summary">
                        </div>
                </div>

                <div class="card sidebar-card">
                    <h3>⚙️ Gestión de Técnicos</h3>
                    <div class="tech-mgmt-list" id="tech-mgmt-list">
                        </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="openAddTechModal()">+ Añadir Técnico</button>
                </div>
            </aside>
        </div>
    </div>

    <div class="modal-overlay" id="tech-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Añadir Técnico</h3>
                <button class="btn btn-secondary" onclick="closeTechModal()" style="padding: 5px 10px;">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="tech-id-edit" value="">
                <div class="form-group">
                    <label>Nombre del Técnico</label>
                    <input type="text" id="tech-name-input" placeholder="Ej. J.Carlos">
                </div>
                <div class="form-group">
                    <label>Color Asignado</label>
                    <input type="color" id="tech-color-input" value="#3b82f6" style="width: 100%; height: 40px; border: none; border-radius: var(--radius-md); cursor: pointer;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="btn-delete-tech" onclick="deleteTech()" class="hidden">Eliminar</button>
                <button class="btn btn-primary" onclick="saveTech()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="reset-year-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>⚠️ Generar Nuevo Año</h3>
                <button class="btn btn-secondary" onclick="closeResetYearModal()" style="padding: 5px 10px;">✕</button>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de generar un nuevo cuadrante aleatorio para todo el año 2025?</p>
                <p>Esto <strong>borrará el cuadrante actual</strong>
