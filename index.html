<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Guardias - Técnicos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --badge-bg: #eff6ff;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--bg-card);
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .month-selector button {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .month-selector button:hover {
            background: var(--border);
        }

        .grid-dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-dashboard {
                grid-template-columns: 2fr 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Resumen de Técnicos / Importes */
        .tech-summary-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tech-summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-main);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .tech-info div:first-child {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .tech-info div:last-child {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tech-amount {
            font-weight: 700;
            color: var(--success);
            font-size: 1rem;
        }

        /* Calendario Simple */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-day-header {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 8px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-main);
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .calendar-day:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .calendar-day .day-num {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .calendar-day .day-tech {
            font-size: 0.65rem;
            color: var(--primary);
            font-weight: 500;
            background: var(--badge-bg);
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 2px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .calendar-day.festivo {
            background-color: #fef2f2;
            border-color: #fecaca;
        }

        .calendar-day.festivo .day-num {
            color: #dc2626;
        }

        /* Configuración Rápida / Modal o Sección inferior */
        .settings-section {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <header>
            <h1>📅 Control de Guardias</h1>
            <div class="month-selector">
                <button onclick="changeMonth(-1)">‹</button>
                <span id="current-month-label" style="font-weight: 600; min-width: 120px; text-align: center;">Septiembre 2026</span>
                <button onclick="changeMonth(1)">›</button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <div class="grid-dashboard">
            <!-- Calendario -->
            <div class="card">
                <h2>🗓️ Calendario de Turnos</h2>
                <div class="calendar-grid" id="calendar-header">
                    <div class="calendar-day-header">L</div>
                    <div class="calendar-day-header">M</div>
                    <div class="calendar-day-header">X</div>
                    <div class="calendar-day-header">J</div>
                    <div class="calendar-day-header">V</div>
                    <div class="calendar-day-header">S</div>
                    <div class="calendar-day-header">D</div>
                </div>
                <div class="calendar-grid" id="calendar-days" style="margin-top: 6px;">
                    <!-- Generado por JS -->
                </div>
            </div>

            <!-- Resumen y Presupuesto -->
            <div class="card">
                <h2>💶 Resumen Mensual</h2>
                <div class="tech-summary-list" id="tech-summary">
                    <!-- Generado por JS -->
                </div>
                <div class="settings-section">
                    <button class="btn-primary" style="width: 100%;" onclick="alert('Módulo de configuración de tarifas y festivos')">⚙️ Ajustar Tarifas</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de ejemplo
        const tecnicos = ["Juan Carlos", "Técnico 2", "Técnico 3", "Técnico 4"];
        let currentYear = 2026;
        let currentMonth = 8; // Septiembre (0-indexed)

        const monthsNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        function renderApp() {
            document.getElementById('current-month-label').innerText = `${monthsNames[currentMonth]} ${currentYear}`;
            renderCalendar();
            renderSummary();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';

            const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7; // Lunes como primer día
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Espacios vacíos iniciales
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                container.appendChild(emptyCell);
            }

            // Días del mes
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                const isWeekend = (firstDayIndex + day - 1) % 7 >= 5;
                
                cell.className = `calendar-day ${isWeekend ? 'festivo' : ''}`;
                
                // Simulación de asignación rotativa simple
                const techAssigned = tecnicos[(day + currentMonth) % tecnicos.length];

                cell.innerHTML = `
                    <span class="day-num">${day}</span>
                    <span class="day-tech" title="${techAssigned}">${techAssigned.split(' ')[0]}</span>
                `;
                
                cell.onclick = () => {
                    alert(`Día ${day} de ${monthsNames[currentMonth]}: Guardia asignada a ${techAssigned}`);
                };

                container.appendChild(cell);
            }
        }

        function renderSummary() {
            const container = document.getElementById('tech-summary');
            container.innerHTML = '';

            tecnicos.forEach((tech, index) => {
                // Cálculo simulado de turnos e importe
                const turnosCount = 7 + (index % 2); 
                const importe = turnosCount * 145; // Ejemplo tarifa base

                const item = document.createElement('div');
                item.className = 'tech-summary-item';
                item.innerHTML = `
                    <div class="tech-info">
                        <div>${tech}</div>
                        <div>${turnosCount} guardias este mes</div>
                    </div>
                    <div class="tech-amount">${importe} €</div>
                `;
                container.appendChild(item);
            });
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderApp();
        }

        // Inicializar
        renderApp();
    </script>
</body>
</html>
