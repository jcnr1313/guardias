<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Guardias - Técnicos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f0f4f8;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 8px;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-main); padding: 24px; min-height: 100vh; }
        .main-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        header { background: var(--bg-card); padding: 20px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); flex-wrap: wrap; gap: 15px; }
        header h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
        .header-actions { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        
        .btn { padding: 10px 16px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;}
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--bg-app); border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }
        
        .month-nav { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        
        .calendar-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow-x: auto; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 2px; border: 1px solid var(--border); background: var(--border); border-radius: var(--radius-md); }
        
        .cal-header { text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); padding: 12px 5px; background: var(--bg-app); }
        .cal-cell { background: var(--bg-card); min-height: 120px; padding: 10px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .cal-cell.other-month { background: #f9fafb; opacity: 0.5; }
        
        .day-header-row { display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; }
        .day-num { font-weight: 700; font-size: 1.1rem; line-height: 1; }
        .cal-cell.is-festivo .day-num { color: #dc2626; }
        
        .fest-icons { display: flex; gap: 3px; }
        .fest-icon { font-size: 0.6rem; font-weight: bold; padding: 2px 4px; border-radius: 4px; color: white; }
        .fest-nac { background-color: #dc2626; }
        .fest-aut { background-color: #ea580c; }
        .fest-loc { background-color: #9333ea; }

        .guardia-banner { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; text-align: center; margin: 6px 0; z-index: 2; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        .day-rates { display: flex; flex-direction: column; gap: 2px; font-size: 0.7rem; color: var(--text-muted); z-index: 2; margin-top: auto; }
        .rate-row { display: flex; justify-content: space-between; }
        .rate-val { font-weight: 600; }
        .cal-cell.is-festivo .rate-row.lab { text-decoration: line-through; opacity: 0.4; }
        .cal-cell.is-festivo .rate-row.fes { color: #dc2626; font-weight: bold; }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .sidebar-card h3 { font-size: 1.1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .weekly-summary-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .weekly-item { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: #fafafa; }
        .weekly-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .weekly-details { display: flex; justify-content: space-between; align-items: center; }
        .weekly-tech { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; }
        .tech-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .weekly-pay { font-weight: 800; font-size: 1.05rem; color: #16a34a; }

        .tech-mgmt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .tech-mgmt-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-app); border-radius: var(--radius-md); border: 1px solid var(--border); }
        .tech-mgmt-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.9rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal { background: var(--bg-card); padding: 30px; border-radius: var(--radius-lg); width: 400px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 20px; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-body { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.9rem; font-weight: 600; }
        .form-group input { padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>📅 Cuadrante de Guardias</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="generarNuevoAnio()">🎲 Generar Cuadrante Anual</button>
                <div class="month-nav">
                    <button class="btn btn-secondary" onclick="changeMonth(-1)">‹</button>
                    <span id="current-month-label" style="min-width: 180px; text-align: center;"></span>
                    <button class="btn btn-secondary" onclick="changeMonth(1)">›</button>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card calendar-card">
                <h2>🗓️ Calendario Mensual</h2>
                <div class="calendar-grid" id="calendar-grid-container">
                    <div class="cal-header">Lun</div>
                    <div class="cal-header">Mar</div>
                    <div class="cal-header">Mié</div>
                    <div class="cal-header">Jue</div>
                    <div class="cal-header">Vie</div>
                    <div class="cal-header">Sáb</div>
                    <div class="cal-header">Dom</div>
                </div>
            </div>

            <aside class="sidebar">
                <div class="card sidebar-card">
                    <h3>📋 Guardias Semanales (Viernes a Viernes)</h3>
                    <div class="weekly-summary-list" id="weekly-summary"></div>
                </div>

                <div class="card sidebar-card">
                    <h3>⚙️ Gestión de Técnicos</h3>
                    <div class="tech-mgmt-list" id="tech-mgmt-list"></div>
                    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="openAddTechModal()">+ Añadir Técnico</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modal Técnico -->
    <div class="modal-overlay" id="tech-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Añadir Técnico</h3>
                <button class="btn btn-secondary" onclick="closeTechModal()" style="padding: 4px 8px;">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="tech-index-edit" value="-1">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="tech-name-input" placeholder="Ej. Juan Carlos">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="tech-color-input" value="#3b82f6" style="width: 100%; height: 40px; border: none; border-radius: 8px; cursor: pointer;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="btn-delete-tech" onclick="deleteTech()">Eliminar</button>
                <button class="btn btn-primary" onclick="saveTech()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // Configuración inicial y datos
        let currentYear = 2026;
        let currentMonth = 0; // Enero

        const monthsNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        let tecnicos = [
            { name: "J.Carlos", color: "#facc15" },
            { name: "Óscar Ibarreta", color: "#ef4444" },
            { name: "Lucas", color: "#d946ef" },
            { name: "Óscar Ibañez", color: "#3b82f6" }
        ];

        // Festivos fijos y específicos (Mes 0-indexed, Día)
        // Nacionales (nac), Comunidad Valenciana (aut), Local Valencia (loc)
        const festivosFijos = {
            "0-1": [{type: "nac", label: "Año Nuevo"}],
            "0-6": [{type: "nac", label: "Reyes"}],
            "2-19": [{type: "loc", label: "San José"}],
            "3-3": [{type: "aut", label: "San Vicente"}], // Aprox según imagen
            "4-1": [{type: "nac", label: "Trabajador"}],
            "5-24": [{type: "aut", label: "San Juan"}],
            "7-15": [{type: "nac", label: "Asunción"}],
            "9-9": [{type: "aut", label: "C. Valenciana"}],
            "9-12": [{type: "nac", label: "Fiesta Nacional"}],
            "10-1": [{type: "nac", label: "Todos los Santos"}],
            "11-6": [{type: "nac", label: "Constitución"}],
            "11-8": [{type: "nac", label: "Inmaculada"}],
            "11-25": [{type: "nac", label: "Navidad"}],
            "11-31": [{type: "loc", label: "Festivo Local"}],
            "2-27": [{type: "loc", label: "Falla/Local"}],
            "3-6": [{type: "loc", label: "Local"}],
            "11-4": [{type: "loc", label: "Local"}]
        };

        // Almacén de asignaciones de guardias por semana (clave: 'YYYY-MM-DD' del viernes de inicio)
        let guardiasSemanas = {};

        function getFestivosDelDia(year, month, day) {
            const date = new Date(year, month, day);
            const dayOfWeek = date.getDay(); // 0 Dom, 6 Sáb
            let festivos = [];

            // Sábados y Domingos siempre festivos de 70€
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                festivos.push({ type: "fin", label: "Fin de semana" });
            }

            // Festivos específicos calendarizados
            const key = `${month}-${day}`;
            if (festivosFijos[key]) {
                festivos = festivos.concat(festivosFijos[key]);
            }
            return festivos;
        }

        function initApp() {
            generarCuadranteAnualAutomatico();
            renderApp();
        }

        function generarCuadranteAnualAutomatico() {
            if (Object.keys(guardiasSemanas).length > 0) return; // Si ya existen, no sobrescribir
            
            // Empezar desde el primer viernes del año o cercano
            let d = new Date(currentYear, 0, 1);
            while (d.getDay() !== 5) { // 5 = Viernes
                d.setDate(d.getDate() + 1);
            }

            let techIndex = 0;
            while (d.getFullYear() === currentYear) {
                const fechaStr = d.toISOString().split('T')[0];
                guardiasSemanas[fechaStr] = tecnicos[techIndex % tecnicos.length].name;
                
                techIndex++;
                d.setDate(d.getDate() + 7); // Siguiente viernes
            }
        }

        function generarNuevoAnio() {
            if(confirm("¿Estás seguro de generar un nuevo cuadrante aleatorio rotando los técnicos?")) {
                guardiasSemanas = {};
                let d = new Date(currentYear, 0, 1);
                while (d.getDay() !== 5) { d.setDate(d.getDate() + 1); }

                let indices = Array.from(Array(tecnicos.length).keys());
                // Mezcla aleatoria justa
                indices.sort(() => Math.random() - 0.5);
                let i = 0;

                while (d.getFullYear() === currentYear) {
                    const fechaStr = d.toISOString().split('T')[0];
                    guardiasSemanas[fechaStr] = tecnicos[indices[i % indices.length]].name;
                    i++;
                    d.setDate(d.getDate() + 7);
                }
                renderApp();
            }
        }

        function renderApp() {
            document.getElementById('current-month-label').innerText = `${monthsNames[currentMonth]} ${currentYear}`;
            renderCalendar();
            renderWeeklySummary();
            renderTechManagement();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-grid-container');
            // Mantener cabeceras
            container.innerHTML = `
                <div class="cal-header">Lun</div>
                <div class="cal-header">Mar</div>
                <div class="cal-header">Mié</div>
                <div class="cal-header">Jue</div>
                <div class="cal-header">Vie</div>
                <div class="cal-header">Sáb</div>
                <div class="cal-header">Dom</div>
            `;

            const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7; 
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();

            // Rellenar días del mes anterior
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const cell = document.createElement('div');
                cell.className = 'cal-cell other-month';
                cell.innerHTML = `<span class="day-num" style="opacity:0.4">${dayNum}</span>`;
                container.appendChild(cell);
            }

            // Días del mes actual
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                const festivos = getFestivosDelDia(currentMonth, day); // Nota: corregido orden en llamadas internas si procede
                const isFestivo = festivos.length > 0;

                cell.className = `cal-cell ${isFestivo ? 'is-festivo' : ''}`;

                // Averiguar qué técnico está de guardia este día buscando el viernes de su semana correspondiente
                let fechaActualObj = new Date(currentYear, currentMonth, day);
                let tecnicoGuardia = "";
                let colorTecnico = "#cbd5e1";

                // Buscar el viernes de inicio de esta semana (o anterior)
                for (let k = 0; k < 7; k++) {
                    let dCheck = new Date(fechaActualObj);
                    dCheck.setDate(dCheck.getDate() - k);
                    if (dCheck.getDay() === 5) { // Viernes
                        let fStr = dCheck.toISOString().split('T')[0];
                        if (guardiasSemanas[fStr]) {
                            tecnicoGuardia = guardiasSemanas[fStr];
                        }
                        break;
                    }
                }

                let techObj = tecnicos.find(t => t.name === tecnicoGuardia);
                if (techObj) colorTecnico = techObj.color;

                let iconosHtml = '';
                festivos.forEach(f => {
                    if(f.type !== 'fin') {
                        iconosHtml += `<span class="fest-icon fest-${f.type}" title="${f.label}">${f.type.toUpperCase()}</span>`;
                    }
                });

                cell.innerHTML = `
                    <div class="day-header-row">
                        <span class="day-num">${day}</span>
                        <div class="fest-icons">${iconosHtml}</div>
                    </div>
                    ${tecnicoGuardia ? `<div class="guardia-banner" style="background-color: ${colorTecnico}33; color: ${colorTecnico}; border: 1px solid ${colorTecnico}">${tecnicoGuardia.split(' ')[0]}</div>` : ''}
                    <div class="day-rates">
                        <div class="rate-row lab"><span>Laboral</span><span class="rate-val">28€</span></div>
                        <div class="rate-row fes"><span>Festivo/Fines</span><span class="rate-val">70€</span></div>
                    </div>
                `;
                container.appendChild(cell);
            }
        }

        function renderWeeklySummary() {
            const container = document.getElementById('weekly-summary');
            container.innerHTML = '';

            // Listar semanas de viernes a viernes que intersectan con el mes actual
            let d = new Date(currentYear, currentMonth, 1);
            while (d.getDay() !== 5) { d.setDate(d.getDate() - 1); } // Retroceder al primer viernes

            let finMes = new Date(currentYear, currentMonth + 1, 0);

            while (d <= finMes) {
                let fechaStr = d.toISOString().split('T')[0];
                let tecnico = guardiasSemanas[fechaStr] || "Sin asignar";
                
                let fechaFin = new Date(d);
                fechaFin.setDate(fechaFin.getDate() + 7);

                // Calcular importe de la semana (7 días: desde viernes hasta el siguiente viernes)
                let totalSemana = 0;
                let dCalc = new Date(d);
                for(let i=0; i<7; i++) {
                    let festivosDia = getFestivosDelDia(dCalc.getMonth(), dCalc.getDate());
                    if (festivosDia.length > 0) {
                        totalSemana += 70; // Festivo o fin de semana
                    } else {
                        totalSemana += 28; // Laboral
                    }
                    dCalc.setDate(dCalc.getDate() + 1);
                }

                let techObj = tecnicos.find(t => t.name === tecnico);
                let color = techObj ? techObj.color : '#cbd5e1';

                const item = document.createElement('div');
                item.className = 'weekly-item';
                item.innerHTML = `
                    <div class="weekly-header">
                        <span>Del ${d.getDate()} ${monthsNames[d.getMonth()]} al ${fechaFin.getDate()} ${monthsNames[fechaFin.getMonth()]}</span>
                    </div>
                    <div class="weekly-details">
                        <div class="weekly-tech">
                            <span class="tech-color-dot" style="background: ${color}"></span>
                            <select onchange="cambiarTecnicoSemana('${fechaStr}', this.value)" style="border:1px solid var(--border); border-radius:4px; padding:2px 6px; font-weight:600;">
                                ${tecnicos.map(t => `<option value="${t.name}" ${t.name === tecnico ? 'selected' : ''}>${t.name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="weekly-pay">${totalSemana} €</div>
                    </div>
                `;
                container.appendChild(item);

                d.setDate(d.getDate() + 7);
            }
        }

        function cambiarTecnicoSemana(fechaStr, nuevoTecnico) {
            guardiasSemanas[fechaStr] = nuevoTecnico;
            renderApp();
        }

        function renderTechManagement() {
            const container = document.getElementById('tech-mgmt-list');
            container.innerHTML = '';

            tecnicos.forEach((t, index) => {
                const item = document.createElement('div');
                item.className = 'tech-mgmt-item';
                item.innerHTML = `
                    <div class="tech-mgmt-info">
                        <span class="tech-color-dot" style="background: ${t.color}"></span>
                        <span>${t.name}</span>
                    </div>
                    <button class="btn btn-secondary" style="padding: 4px 8px; font-size:0.8rem;" onclick="openEditTechModal(${index})">Editar</button>
                `;
                container.appendChild(item);
            });
        }

        function openAddTechModal() {
            document.getElementById('modal-title').innerText = "Añadir Técnico";
            document.getElementById('tech-index-edit').value = "-1";
            document.getElementById('tech-name-input').value = "";
            document.getElementById('tech-color-input').value = "#3b82f6";
            document.getElementById('btn-delete-tech').classList.add('hidden');
            document.getElementById('tech-modal-overlay').style.display = 'flex';
        }

        function openEditTechModal(index) {
            const t = tecnicos[index];
            document.getElementById('modal-title').innerText = "Editar Técnico";
            document.getElementById('tech-index-edit').value = index;
            document.getElementById('tech-name-input').value = t.name;
            document.getElementById('tech-color-input').value = t.color;
            document.getElementById('btn-delete-tech').classList.remove('hidden');
            document.getElementById('tech-modal-overlay').style.display = 'flex';
        }

        function closeTechModal() {
            document.getElementById('tech-modal-overlay').style.display = 'none';
        }

        function saveTech() {
            const index = parseInt(document.getElementById('tech-index-edit').value);
            const name = document.getElementById('tech-name-input').value.trim();
            const color = document.getElementById('tech-color-input').value;

            if (!name) {
                alert("Introduce un nombre válido");
                return;
            }

            if (index === -1) {
                tecnicos.push({ name, color });
            } else {
                tecnicos[index].name = name;
                tecnicos[index].color = color;
            }

            closeTechModal();
            renderApp();
        }

        function deleteTech() {
            const index = parseInt(document.getElementById('tech-index-edit').value);
            if (index !== -1) {
                tecnicos.splice(index, 1);
                closeTechModal();
                renderApp();
            }
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderApp();
        }

        // Ejecutar inicialización
        initApp();
    </script>
</body>
</html>
