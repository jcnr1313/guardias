<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Guardias - Técnicos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-app: #f0f4f8; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --radius-lg: 16px; --radius-md: 8px;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="dark"] {
            --bg-app: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-app); color: var(--text-main); padding: 24px; min-height: 100vh; }
        .main-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        header { background: var(--bg-card); padding: 20px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); flex-wrap: wrap; gap: 15px; }
        header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; transition: var(--transition); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; text-decoration: none;}
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--bg-app); border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border); }
        .month-nav { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .calendar-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow-x: auto; }
        .calendar-legend { display: flex; gap: 15px; margin-bottom: 15px; font-size: 0.8rem; font-weight: 600; align-items: center; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(100px, 1fr)); gap: 2px; border: 1px solid var(--border); background: var(--border); border-radius: var(--radius-md); }
        .cal-header { text-align: center; font-weight: 700; font-size: 0.8rem; color: var(--text-muted); padding: 10px 4px; background: var(--bg-app); }
        .cal-cell { background: var(--bg-card); min-height: 105px; padding: 8px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .cal-cell.other-month { background: var(--bg-app); opacity: 0.4; }
        .day-header-row { display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; }
        .day-num { font-weight: 700; font-size: 1rem; line-height: 1; }
        .cal-cell.is-festivo .day-num { color: #dc2626; }
        .fest-icons { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; max-width: 60px; }
        .fest-icon { font-size: 0.5rem; font-weight: bold; padding: 1px 3px; border-radius: 3px; color: white; }
        .fest-nac { background-color: #dc2626; } .fest-aut { background-color: #ea580c; } .fest-loc { background-color: #9333ea; }
        .guardia-banner { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; padding: 3px 4px; border-radius: 4px; text-align: center; margin: 4px 0; z-index: 2; }
        .day-rates { display: flex; flex-direction: column; gap: 1px; font-size: 0.65rem; color: var(--text-muted); z-index: 2; margin-top: auto; }
        .rate-row { display: flex; justify-content: space-between; }
        .rate-val { font-weight: 600; }
        .cal-cell.is-festivo .rate-row.lab { text-decoration: line-through; opacity: 0.4; }
        .cal-cell.is-festivo .rate-row.fes { color: #dc2626; font-weight: bold; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .sidebar-card h3 { font-size: 1.1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
        .weekly-summary-list { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 5px; }
        .weekly-item { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--bg-app); }
        .weekly-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .weekly-details { display: flex; justify-content: space-between; align-items: center; }
        .weekly-tech { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; }
        .tech-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .weekly-pay { font-weight: 800; font-size: 1.05rem; color: #16a34a; }
        #toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: white; padding: 12px 20px; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-weight: 600; font-size: 0.9rem; z-index: 2000; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="index.html" class="btn btn-secondary" title="Volver al Portal"><i class="fa-solid fa-arrow-left"></i></a>
                <h1>🛡️ Cuadrante de Guardias</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="theme-btn">🌙</button>
                <button class="btn btn-primary" onclick="restaurarCuadranteOficial()">🔄 Sincronizar Oficial</button>
                <div class="month-nav">
                    <button class="btn btn-secondary" onclick="changeMonth(-1)">‹</button>
                    <span id="current-month-label" style="min-width: 180px; text-align: center;"></span>
                    <button class="btn btn-secondary" onclick="changeMonth(1)">›</button>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card calendar-card">
                <h2>🗓️ Calendario Mensual</h2>
                <div class="calendar-legend">
                    <div class="legend-item"><span class="fest-icon fest-nac">NAC</span> Nacional</div>
                    <div class="legend-item"><span class="fest-icon fest-aut">AUT</span> C. Valenciana</div>
                    <div class="legend-item"><span class="fest-icon fest-loc">LOC</span> Local Valencia</div>
                </div>
                <div class="calendar-grid" id="calendar-grid-container">
                    <div class="cal-header">Lun</div><div class="cal-header">Mar</div><div class="cal-header">Mié</div><div class="cal-header">Jue</div><div class="cal-header">Vie</div><div class="cal-header">Sáb</div><div class="cal-header">Dom</div>
                </div>
            </div>

            <aside class="sidebar">
                <div class="card sidebar-card">
                    <h3>📋 Guardias Semanales (Viernes a Viernes)</h3>
                    <div class="weekly-summary-list" id="weekly-summary"></div>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast">¡Actualizado!</div>

    <script>
        const SUPABASE_URL = 'https://nefnltsxblfpfrifdsgy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ICUgIbsQd736F6tkK1FxCw_DiyJiIFk';
        let dbSupabase = null;
        try { dbSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

        let currentYear = 2026;
        let currentMonth = 8;
        const monthsNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        let tecnicos = [
            { id: 1, name: "J.Carlos", color: "#facc15" },
            { id: 2, name: "Óscar Ibarreta", color: "#ef4444" },
            { id: 3, name: "Lucas", color: "#d946ef" },
            { id: 4, name: "Óscar Ibañez", color: "#3b82f6" }
        ];
        let guardiasSemanas = {};

        const cuadranteOficial2026 = {
            "2026-01-02": "J.Carlos", "2026-01-09": "Óscar Ibarreta", "2026-01-16": "Lucas", "2026-01-23": "Óscar Ibañez",
            "2026-01-30": "J.Carlos", "2026-02-06": "Óscar Ibarreta", "2026-02-13": "Lucas", "2026-02-20": "Óscar Ibañez",
            "2026-02-27": "J.Carlos", "2026-03-06": "Óscar Ibarreta", "2026-03-13": "Lucas", "2026-03-20": "Óscar Ibañez",
            "2026-03-27": "J.Carlos", "2026-04-03": "Óscar Ibarreta", "2026-04-10": "Lucas", "2026-04-17": "Óscar Ibañez", "2026-04-24": "J.Carlos",
            "2026-05-01": "Óscar Ibarreta", "2026-05-08": "Lucas", "2026-05-15": "Óscar Ibañez", "2026-05-22": "J.Carlos",
            "2026-05-29": "Óscar Ibarreta", "2026-06-05": "Lucas", "2026-06-12": "Óscar Ibañez", "2026-06-19": "J.Carlos", "2026-06-26": "Óscar Ibarreta",
            "2026-07-03": "Lucas", "2026-07-10": "Óscar Ibarreta", "2026-07-17": "J.Carlos", "2026-07-24": "Óscar Ibañez",
            "2026-07-31": "J.Carlos", "2026-08-07": "Óscar Ibarreta", "2026-08-14": "Lucas", "2026-08-21": "Óscar Ibarreta", "2026-08-28": "Lucas",
            "2026-09-04": "J.Carlos", "2026-09-11": "Óscar Ibañez", "2026-09-18": "Lucas", "2026-09-25": "Óscar Ibarreta",
            "2026-10-02": "Óscar Ibañez", "2026-10-09": "J.Carlos", "2026-10-16": "Óscar Ibarreta", "2026-10-23": "Lucas", "2026-10-30": "Óscar Ibañez",
            "2026-11-06": "J.Carlos", "2026-11-13": "Óscar Ibarreta", "2026-11-20": "Lucas", "2026-11-27": "Óscar Ibañez",
            "2026-12-04": "J.Carlos", "2026-12-11": "Óscar Ibarreta", "2026-12-18": "Lucas", "2026-12-25": "Óscar Ibañez"
        };

        const festivosOficiales = {
            "0-1": [{type: "nac", label: "Año Nuevo"}], "0-6": [{type: "nac", label: "Epifanía"}], "2-19": [{type: "loc", label: "San José"}],
            "4-1": [{type: "nac", label: "Trabajo"}], "7-15": [{type: "nac", label: "Asunción"}], "9-9": [{type: "aut", label: "C. Valenciana"}],
            "9-12": [{type: "nac", label: "Fiesta Nacional"}], "10-1": [{type: "nac", label: "Todos los Santos"}], "11-25": [{type: "nac", label: "Navidad"}]
        };

        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function toggleTheme() {
            const h = document.documentElement, b = document.getElementById('theme-btn');
            if (h.getAttribute('data-theme') === 'light') { h.setAttribute('data-theme', 'dark'); b.innerText = '☀️'; }
            else { h.setAttribute('data-theme', 'light'); b.innerText = '🌙'; }
        }
        function getFestivos(m, d) {
            let f = []; const dayW = new Date(currentYear, m, d).getDay();
            if (dayW === 0 || dayW === 6) f.push({ type: "fin", label: "Fin de semana" });
            if (festivosOficiales[`${m}-${d}`]) f = f.concat(festivosOficiales[`${m}-${d}`]);
            return f;
        }

        async function init() {
            if (dbSupabase) {
                let { data: guardData } = await dbSupabase.from('guardias_semanas').select('*');
                if (guardData && guardData.length > 0) {
                    guardiasSemanas = {};
                    guardData.forEach(r => guardiasSemanas[r.fecha_inicio] = r.tecnico);
                }
            }
            if (Object.keys(guardiasSemanas).length === 0) guardiasSemanas = { ...cuadranteOficial2026 };
            render();
        }

        async function restaurarCuadranteOficial() {
            guardiasSemanas = { ...cuadranteOficial2026 };
            if (dbSupabase) {
                let rows = Object.keys(guardiasSemanas).map(k => ({ fecha_inicio: k, tecnico: guardiasSemanas[k] }));
                await dbSupabase.from('guardias_semanas').upsert(rows, { onConflict: ['fecha_inicio'] });
            }
            render(); showToast("✅ Cuadrante oficial sincronizado");
        }

        function render() {
            document.getElementById('current-month-label').innerText = `${monthsNames[currentMonth]} ${currentYear}`;
            renderCalendar(); renderWeekly();
        }

        function renderCalendar() {
            const c = document.getElementById('calendar-grid-container');
            c.innerHTML = '<div class="cal-header">Lun</div><div class="cal-header">Mar</div><div class="cal-header">Mié</div><div class="cal-header">Jue</div><div class="cal-header">Vie</div><div class="cal-header">Sáb</div><div class="cal-header">Dom</div>';
            
            const firstIdx = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevDays = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = firstIdx - 1; i >= 0; i--) {
                c.innerHTML += `<div class="cal-cell other-month"><span class="day-num">${prevDays - i}</span></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const festivos = getFestivos(currentMonth, day);
                const isFest = festivos.length > 0;
                let dtObj = new Date(currentYear, currentMonth, day);
                let dtStr = dtObj.toISOString().split('T')[0];

                let techG = "";
                for (let k = 0; k < 7; k++) {
                    let dCheck = new Date(dtObj); dCheck.setDate(dCheck.getDate() - k);
                    if (dCheck.getDay() === 5) {
                        let fStr = dCheck.toISOString().split('T')[0];
                        if (guardiasSemanas[fStr]) techG = guardiasSemanas[fStr];
                        break;
                    }
                }
                let tObj = tecnicos.find(t => t.name === techG);
                let color = tObj ? tObj.color : '#cbd5e1';

                let icons = '';
                festivos.forEach(f => { if(f.type !== 'fin') icons += `<span class="fest-icon fest-${f.type}">${f.type.toUpperCase()}</span>`; });

                c.innerHTML += `
                    <div class="cal-cell ${isFest ? 'is-festivo' : ''}">
                        <div class="day-header-row"><span class="day-num">${day}</span><div class="fest-icons">${icons}</div></div>
                        ${techG ? `<div class="guardia-banner" style="background-color:${color}22; color:${color}; border:1px solid ${color}">${techG.split(' ')[0]}</div>` : ''}
                        <div class="day-rates">
                            <div class="rate-row lab"><span>Lab</span><span class="rate-val">28€</span></div>
                            <div class="rate-row fes"><span>Fes</span><span class="rate-val">70€</span></div>
                        </div>
                    </div>
                `;
            }
        }

        function renderWeekly() {
            const container = document.getElementById('weekly-summary');
            container.innerHTML = '';
            let d = new Date(currentYear, currentMonth, 1);
            while (d.getDay() !== 5) { d.setDate(d.getDate() - 1); }
            let finMes = new Date(currentYear, currentMonth + 1, 0);

            while (d <= finMes) {
                let fechaStr = d.toISOString().split('T')[0];
                let tecnico = guardiasSemanas[fechaStr] || "Sin asignar";
                let fechaFin = new Date(d); fechaFin.setDate(fechaFin.getDate() + 7);

                let totalSemana = 0; let dCalc = new Date(d);
                for(let i = 0; i < 7; i++) {
                    totalSemana += getFestivos(dCalc.getMonth(), dCalc.getDate()).length > 0 ? 70 : 28;
                    dCalc.setDate(dCalc.getDate() + 1);
                }
                let tObj = tecnicos.find(t => t.name === tecnico);
                let color = tObj ? tObj.color : '#cbd5e1';

                container.innerHTML += `
                    <div class="weekly-item">
                        <div class="weekly-header">Del ${d.getDate()} ${monthsNames[d.getMonth()]} al ${fechaFin.getDate()} ${monthsNames[fechaFin.getMonth()]}</div>
                        <div class="weekly-details">
                            <div class="weekly-tech">
                                <span class="tech-color-dot" style="background:${color}"></span>
                                <select onchange="cambiarTecnico('${fechaStr}', this.value)" style="border:1px solid var(--border); background:var(--bg-card); color:var(--text-main); border-radius:4px; padding:2px 6px; font-weight:600;">
                                    ${tecnicos.map(t => `<option value="${t.name}" ${t.name === tecnico ? 'selected' : ''}>${t.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="weekly-pay">${totalSemana} €</div>
                        </div>
                    </div>
                `;
                d.setDate(d.getDate() + 7);
            }
        }

        async function cambiarTecnico(fechaStr, nuevo) {
            guardiasSemanas[fechaStr] = nuevo;
            if (dbSupabase) await dbSupabase.from('guardias_semanas').upsert({ fecha_inicio: fechaStr, tecnico: nuevo }, { onConflict: ['fecha_inicio'] });
            render(); showToast("☁️ Guardia actualizada");
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            render();
        }

        init();
    </script>
</body>
</html>
